# AWS Amplify Hosting build settings for the React client (monorepo: client/).
# Set the VITE_API_BASE_URL environment variable in the Amplify console to the
# deployed API Gateway URL (no trailing slash).
version: 1
applications:
  - appRoot: client
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
